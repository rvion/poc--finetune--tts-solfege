name: Fallback GitHub Pages (démo web/)

# Filet de sécurité : publie le même dossier web/ sur GitHub Pages, pour avoir une
# démo en ligne même sans compte Cloudflare. Activation : Settings -> Pages ->
# Source = GitHub Actions. URL : https://rvion.github.io/poc--finetune--tts-solfege/

on:
  push:
    branches: ["main", "claude/solfege-speech-recognition-jg97rv"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
